<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8F6F2"><title>Ingresar · TORA</title><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/login.css"></head><body>
<main class="card"><img class="login-logo" src="/icons/tora-mark.png" alt="Logo TORA"><h1>TORA</h1><p id="intro">Tu espacio privado de documentación clínica académica.</p>
<div id="auth-tabs" class="auth-tabs hidden" role="tablist"><button type="button" id="tab-login" class="active">Ingresar</button><button type="button" id="tab-register">Crear cuenta</button></div>
<form id="login-form"><div id="name-wrap" class="hidden"><label for="display_name">Nombre</label><input id="display_name" autocomplete="name" maxlength="100" placeholder="Nombre y apellido"></div>
<label id="user-label" for="user">Correo electrónico</label><input id="user" autocomplete="username" required placeholder="tu@correo.cl">
<label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" required minlength="1" placeholder="Contraseña">
<div id="password-repeat-wrap" class="hidden"><label for="password_repeat">Confirmar contraseña</label><input id="password_repeat" type="password" autocomplete="new-password" placeholder="Repite tu contraseña"></div>
<button id="submit" type="submit">Ingresar a TORA</button></form>
<button class="link-button hidden" id="forgot" type="button">¿Olvidaste tu contraseña?</button>
<p id="msg" class="error" role="status" aria-live="polite"></p>
<small>Prototipo académico · Solo casos ficticios o desidentificados · No introducir fichas clínicas identificables</small>
</main><script type="module" src="/login.js"></script></body></html>
